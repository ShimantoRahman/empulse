name: Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
  schedule:
    # Monday 04:00 UTC, for the remote-data suite only (see the `remote-test` job).
    - cron: "0 4 * * 1"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        env:
          - "py314t-tests"
          - "py314-tests"
          - "py313-tests"
          - "py312-tests"
          - "py311-tests"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Run test suite
        run: uvx --with tox-uv tox -e ${{ matrix.env }} -- -m "not slow and not remote"

  slow-test:
    # The doc-executing suites (tests/test_user_guide.py and other @pytest.mark.slow tests) run
    # here, once, rather than per Python version above — they're slow because they run models and
    # build docs, not because their outcome varies by interpreter version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      # A few documentation pages fetch a small dataset (Give Me Some Credit, Iranian Churn) to show
      # a real workflow. Caching the data home keeps those pages in the PR path without downloading
      # from UCI/OpenML on every run; the key changes whenever the fetching code does.
      - name: Cache downloaded datasets
        uses: actions/cache@v4
        with:
          path: ~/empulse_data
          key: empulse-data-${{ hashFiles('empulse/datasets/_remote.py', 'empulse/datasets/_io.py') }}
      - name: Run slow suite
        run: uvx --with tox-uv tox -e py312-tests -- -m "slow and not remote"

  lowest-test:
    # Every other job installs the newest version of each dependency. This one installs the lowest
    # version pyproject.toml declares, on Python 3.11 where those minimums apply, and runs the suite
    # against the built wheel. It also fails when a declared minimum cannot be installed, since the
    # suite would then never have run against it. The doc pages run here too: they exercise most of
    # the public API, which is what an old dependency breaks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Cache downloaded datasets
        uses: actions/cache@v4
        with:
          path: ~/empulse_data
          key: empulse-data-${{ hashFiles('empulse/datasets/_remote.py', 'empulse/datasets/_io.py') }}
      - name: Run test suite against the lowest dependency versions
        run: uvx --with tox-uv tox -e py311-lowest -- -m "not remote"

  remote-test:
    # The dataset fetchers download from third-party hosts, so they are too slow and too flaky to
    # sit in the PR path. Running them weekly still catches an upstream dataset change within a
    # week, which is the timescale that actually matters for a schema or URL change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Run remote-data suite
        run: uvx --with tox-uv tox -e py312-tests -- -m "remote"
