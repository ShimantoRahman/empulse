[tox]
minversion = 3.8.0
envlist = py3{11,12,13,14}-{tests,docs,lint}, py314t-tests, py311-lowest
isolated_build = true

[gh-actions]
python =
    3.11: py311-{tests, docs, lint}
    3.12: py312-{tests, docs, lint}
    3.13: py313-{tests, docs, lint}
    3.14: py314-{tests, docs, lint}
    3.14t: py314t-tests

[testenv]
package = wheel
setenv =
    PYTHONPATH = {toxinidir}

[testenv:py3{11,12,13,14}-lint]
description = run code formatter and linter (auto-fix)
skip_install = true
deps =
    pre-commit-uv>=4.1.1
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:py3{11,12,13,14}-docs]
runner = uv-venv-lock-runner
description = build documentation with sphinx
dependency_groups =
    docs
commands =
    sphinx-build -b html --write-all --fail-on-warning --keep-going docs/ docs/_build

[testenv:py3{11,12,13,14}-tests]
runner = uv-venv-lock-runner
description = run tests with pytest
dependency_groups =
    test
# `-n auto` spreads the tests over every core (pytest-xdist); the runners CI uses have four.
commands =
    python setup.py build_ext --inplace
    pytest -n auto --basetemp={envtmpdir} {posargs}
    pytest --doctest-modules empulse/ --ignore=empulse/metrics/_loss --ignore=empulse/metrics/_cy_convex_hull --ignore=empulse/models/tree/_cstree --ignore=empulse/models/tree/_cy_proftree

[testenv:py314t-tests]
description = run tests on the free-threaded interpreter (CPython 3.14t)
base_python = py314t
# Resolved fresh rather than from uv.lock, which pins two packages that publish no cp314t wheel:
# catboost and polars. xgboost and lightgbm ship py3-none wheels and do install here. The tests
# that need the missing two skip through pytest.importorskip; tests/datasets is skipped wholesale
# because its modules import polars at module scope. Drop these exclusions once wheels exist.
runner = uv-venv-runner
deps =
    pytest>=8.3.4
    pytest-xdist>=3.8.0
    pytest-cov>=6.0.0
    pandas>=2.2.3
    xgboost>=2.1.4
    lightgbm>=4.5.0
    imbalanced-learn>=0.14.2
    cython>=3.1
    setuptools>=80.9.0
commands =
    python setup.py build_ext --inplace
    pytest -n auto --basetemp={envtmpdir} --ignore=tests/datasets {posargs}

# Test against the lowest version of every dependency pyproject.toml declares, on the oldest supported
# interpreter, which is where those minimums apply. Every other env resolves to the newest versions,
# so without this one a declared minimum is a promise nothing checks.
#
# It tests what a user on those minimums actually runs: the built wheel, whose extensions were compiled
# against the newest numpy and scikit-learn, not an in-place build against the old ones. `tests/` is a
# package, so pytest would put the repository root on sys.path and import the source tree instead;
# running a copy of the suite from outside the checkout is what makes `import empulse` find the wheel.
# `docs/` is copied too, for the pages tests/test_user_guide.py executes.
#
# The versions are resolved in one step and installed exactly. Letting tox install them would not
# hold: it installs `deps` first, and a numpy pulled in there at the newest version already satisfies
# the package's `>=`, so the later install keeps it. `uv pip install -r` of the exact pins downgrades
# whatever is newer, and since they come from one resolution they are consistent by construction.
# check_lowest_versions.py then fails if a declared minimum could not be installed
# (another dependency needs more, or it has no wheel), since the suite would not have tested it.
[testenv:py311-lowest]
description = run tests against the lowest declared version of every dependency, using the built wheel
base_python = py311
runner = uv-venv-runner
extras = boosting, datasets, sampling
setenv =
    PYTHONPATH = {envtmpdir}{/}suite
deps =
    pytest>=8.3.4
    pytest-xdist>=3.8.0
    # scikit-learn before 1.7 cannot read pandas 3's string dtype, which the dataset pages use.
    pandas>=2.2.0,<3
    polars>=1.40.1
    packaging
    uv
commands_pre =
    uv pip compile --quiet --python {env_python} --resolution lowest-direct --only-binary :all: --extra boosting --extra datasets --extra sampling --output-file {envtmpdir}{/}lowest.txt {toxinidir}{/}pyproject.toml
    uv pip install --python {env_python} --only-binary :all: --requirement {envtmpdir}{/}lowest.txt
    python {toxinidir}{/}scripts{/}check_lowest_versions.py {toxinidir}{/}pyproject.toml
    python -c "import shutil, sys; dst = sys.argv[2]; shutil.rmtree(dst, ignore_errors=True); [shutil.copytree(f'{sys.argv[1]}/{d}', f'{dst}/{d}', ignore=shutil.ignore_patterns('_build', 'generated', '__pycache__')) for d in ('tests', 'docs')]" {toxinidir} {envtmpdir}{/}suite
change_dir = {envtmpdir}
commands =
    python -c "import empulse, sys; sys.exit(f'empulse imported from the checkout: {empulse.__file__}' if 'site-packages' not in empulse.__file__ else 0)"
    pytest -c {toxinidir}{/}pyproject.toml --rootdir {envtmpdir}{/}suite -n auto -p no:cacheprovider --basetemp={envtmpdir}{/}basetemp {envtmpdir}{/}suite{/}tests {posargs}

# Test against one specific scikit-learn version, named by $SKLEARN_VERSION rather than hardcoded,
# so a release that does not exist yet can still be tested. Driven by the sklearn-watch workflow;
# run it by hand with e.g. `SKLEARN_VERSION=1.9.0rc1 tox -e py312-sklearn-pinned`.
#
# The factor list runs ahead of the interpreters this package claims in its classifiers, because
# scikit-learn ships wheels for a new CPython before we adopt it (1.9.1 already has cp315 while the
# classifiers stop at 3.14). scripts/check_sklearn_release.py picks which factors to actually run.
#
# `deps` alone does not hold the pin. tox-uv installs `deps`, then separately installs the built
# wheel's own requirements, and that second `uv pip install scikit-learn>=1.9.0` silently replaces
# the pinned version -- with the newest release, or, for a release candidate, with the newest stable,
# since a prerelease does not satisfy a plain `>=` specifier. The env then reports a confident pass
# having tested something other than what it names. `commands_pre` runs after every install phase, so
# reinstating the pin there is what actually makes it stick, and asserting it turns any future
# regression in that machinery into a failure rather than back into a false pass.
[testenv:py3{11,12,13,14,15,16}-sklearn-pinned]
runner = uv-venv-runner
description = run tests against the scikit-learn version in $SKLEARN_VERSION
dependency_groups =
    test
deps =
    scikit-learn=={env:SKLEARN_VERSION}
    uv
commands_pre =
    uv pip install --python {env_python} --reinstall-package scikit-learn --prerelease allow scikit-learn=={env:SKLEARN_VERSION}
    python scripts/assert_sklearn_version.py {env:SKLEARN_VERSION}
commands =
    python setup.py build_ext --inplace
    pytest -n auto --basetemp={envtmpdir} {posargs}

