[tox]
minversion = 3.8.0
envlist = py3{11,12,13,14}-{tests,docs,lint}, py314t-tests
isolated_build = true

[gh-actions]
python =
    3.11: py311-{tests, docs, lint}
    3.12: py312-{tests, docs, lint}
    3.13: py313-{tests, docs, lint}
    3.14: py314-{tests, docs, lint}
    3.14t: py314t-tests

[testenv]
package = wheel
;wheel_build_env = .pkg
setenv =
    PYTHONPATH = {toxinidir}

[testenv:py3{11,12,13,14}-lint]
description = run code formatter and linter (auto-fix)
skip_install = true
deps =
    pre-commit-uv>=4.1.1
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:py3{11,12,13,14}-docs]
runner = uv-venv-lock-runner
description = build documentation with sphinx
dependency_groups =
    docs
commands =
    sphinx-build -b html --write-all --fail-on-warning --keep-going docs/ docs/_build

[testenv:py3{11,12,13,14}-tests]
runner = uv-venv-lock-runner
description = run tests with pytest
dependency_groups =
    test
commands =
    python setup.py build_ext --inplace
    pytest --basetemp={envtmpdir} {posargs}
    pytest --doctest-modules empulse/ --ignore=empulse/metrics/_loss --ignore=empulse/metrics/_cy_convex_hull --ignore=empulse/models/tree/_impurity --ignore=empulse/models/tree/_cy_proftree

[testenv:py314t-tests]
description = run tests on the free-threaded interpreter (CPython 3.14t)
base_python = py314t
# Resolved fresh rather than from uv.lock, which pins two packages that publish no cp314t wheel:
# catboost and polars. xgboost and lightgbm ship py3-none wheels and do install here. The tests
# that need the missing two skip through pytest.importorskip; tests/datasets is skipped wholesale
# because its modules import polars at module scope. Drop these exclusions once wheels exist.
runner = uv-venv-runner
extras = symbolic
deps =
    pytest>=8.3.4
    pytest-cov>=6.0.0
    pandas>=2.2.3
    xgboost>=1.7.4
    lightgbm>=4.5.0
    cython==3.2.5
commands =
    python setup.py build_ext --inplace
    pytest --basetemp={envtmpdir} --ignore=tests/datasets {posargs}

# Test against one specific scikit-learn version, named by $SKLEARN_VERSION rather than hardcoded,
# so a release that does not exist yet can still be tested. Driven by the sklearn-watch workflow;
# run it by hand with e.g. `SKLEARN_VERSION=1.9.0rc1 tox -e py312-sklearn-pinned`.
#
# The factor list runs ahead of the interpreters this package claims in its classifiers, because
# scikit-learn ships wheels for a new CPython before we adopt it (1.9.1 already has cp315 while the
# classifiers stop at 3.14). scripts/check_sklearn_release.py picks which factors to actually run.
#
# `deps` alone does not hold the pin. tox-uv installs `deps`, then separately installs the built
# wheel's own requirements, and that second `uv pip install scikit-learn>=1.9.0` silently replaces
# the pinned version -- with the newest release, or, for a release candidate, with the newest stable,
# since a prerelease does not satisfy a plain `>=` specifier. The env then reports a confident pass
# having tested something other than what it names. `commands_pre` runs after every install phase, so
# reinstating the pin there is what actually makes it stick, and asserting it turns any future
# regression in that machinery into a failure rather than back into a false pass. Pinning before
# `build_ext` also means the Cython extension is compiled against the headers of the pinned version.
#
# `- python scripts/check_cython_abi.py` is diagnostic, not a gate: a new scikit-learn wheel may be
# built with a newer Cython than the one pinned here, which corrupts memory rather than raising (see
# that script's docstring). The leading `-` lets the run continue so pytest decides pass/fail, while
# the check's verdict stays in the log to explain a segfault if one happens.
[testenv:py3{11,12,13,14,15,16}-sklearn-pinned]
runner = uv-venv-runner
description = run tests against the scikit-learn version in $SKLEARN_VERSION
dependency_groups =
    test
deps =
    scikit-learn=={env:SKLEARN_VERSION}
    uv
commands_pre =
    uv pip install --python {env_python} --reinstall-package scikit-learn --prerelease allow scikit-learn=={env:SKLEARN_VERSION}
    python scripts/assert_sklearn_version.py {env:SKLEARN_VERSION}
commands =
    - python scripts/check_cython_abi.py
    python setup.py build_ext --inplace
    pytest --basetemp={envtmpdir} {posargs}

# >>> sklearn-compat-start (auto-generated, do not edit manually)

[testenv:sklearn191-tests]
runner = uv-venv-runner
basepython = python3.12
description = run tests against scikit-learn 1.9.1
dependency_groups =
    test
deps =
    scikit-learn==1.9.1
    uv
commands_pre =
    uv pip install --python {env_python} --reinstall-package scikit-learn --prerelease allow scikit-learn==1.9.1
    python scripts/assert_sklearn_version.py 1.9.1
commands =
    python setup.py build_ext --inplace
    pytest --basetemp={envtmpdir} -m "not slow" {posargs}

